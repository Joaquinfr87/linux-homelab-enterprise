# ==============================================================================
# Nginx — Proxy inverso de la intranet (servicio web)
# Enruta por nombre los servicios publicados. Los que no existen todavía
# (los destinos aún no disponibles) quedan comentados: se activan en su fase.
#
# TLS: certificado wildcard *.sudoers.lan (CA interna). Los archivos llegan
# por el volumen ./services/web/tls (generados con services/web/tls-gen.sh).
# Todo HTTP (80) redirige a HTTPS (443).
# ==============================================================================

# Soporte de WebSocket (Portainer)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Seguridad Bancaria & Rate Limiting (Anti-DDoS Capa 7) ─────────
# Rastrear IPs para limitar tasa de peticiones y conexiones simultáneas
limit_req_zone $binary_remote_addr zone=banco_limit:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=banco_conn:10m;

# Mapeo de escáneres de vulnerabilidades y herramientas ofensivas conocidas
map $http_user_agent $escaner_malicioso {
    default 0;
    '~*(nikto|sqlmap|gobuster|dirbuster|acunetix|wpscan|masscan|zgrab)' 1;
}

# ── Firewall Web de Aplicación (WAF) Anti-SQL Injection (Anti-SQLi) ──
# Analiza parámetros en el Query String (?id=...&user=...)
map $query_string $sqli_en_query {
    default 0;
    '~*union.*select' 1;
    '~*select.*from' 1;
    '~*insert.*into' 1;
    '~*update.*set' 1;
    '~*delete.*from' 1;
    '~*drop.*(table|database|view|procedure)' 1;
    '~*truncate.*table' 1;
    '~*information_schema' 1;
    '~*(benchmark|sleep)\s*\(' 1;
    '~*waitfor.*delay' 1;
    '~*(load_file|into.*outfile|into.*dumpfile)' 1;
    '~*(group_concat|extractvalue|updatexml)' 1;
    '~*(\x27|%27).*(or|and).*(=|<|>|%3d|%3c|%3e)' 1;
    '~*(or|and)\s+([0-9]+|\x27.*\x27)\s*=\s*([0-9]+|\x27.*\x27)' 1;
    '~*(\x27|%27)\s*(--|\x23|%23)' 1;
    '~*(\x2f\x2a.*\x2a\x2f)' 1;
}

# Analiza la URI completa ($request_uri)
map $request_uri $sqli_en_uri {
    default 0;
    '~*union.*select' 1;
    '~*select.*from' 1;
    '~*insert.*into' 1;
    '~*update.*set' 1;
    '~*delete.*from' 1;
    '~*drop.*(table|database|view|procedure)' 1;
    '~*information_schema' 1;
    '~*(benchmark|sleep)\s*\(' 1;
    '~*waitfor.*delay' 1;
    '~*(\x27|%27).*(or|and).*(=|<|>|%3d|%3c|%3e)' 1;
    '~*(or|and)\s+([0-9]+|\x27.*\x27)\s*=\s*([0-9]+|\x27.*\x27)' 1;
    '~*(\x27|%27)\s*(--|\x23|%23)' 1;
}

# Variable unificada de alerta SQLi
map "$sqli_en_query:$sqli_en_uri" $bloqueo_sqli {
    default 0;
    '~*1:' 1;
    '~*:1' 1;
}

# Mapeo Anti-Directory / Path Traversal & LFI
map $request_uri $bloqueo_traversal {
    default 0;
    '~*(\.\./|\.\.\\|%2e%2e%2f|%2e%2e/)' 1;
    '~*(/etc/passwd|/etc/shadow|/proc/self)' 1;
    '~*(boot\.ini|win\.ini)' 1;
}

# Opciones de tamaño de subida
client_max_body_size  5m;

# Ocultar versión de Nginx para dificultar reconocimiento
server_tokens off;

# ── TLS / seguridad global ────────────────────────────────────────
ssl_certificate     /etc/ssl/banco/server.crt;
ssl_certificate_key /etc/ssl/banco/server.key;
ssl_protocols              TLSv1.2 TLSv1.3;
ssl_ciphers                HIGH:!aNULL:!MD5;
ssl_session_cache          shared:SSL:10m;
ssl_session_timeout        10m;

# ── 1. Impresión (CUPS) ─────────────────────────────────────────────
server {
    listen 80;
    server_name print.sudoers.lan;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name print.sudoers.lan;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $cups_upstream http://tso-print:631;
        proxy_pass $cups_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── 2. Portainer (panel de gestión Docker) ──────────────────────────
server {
    listen 80;
    server_name portainer.sudoers.lan;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name portainer.sudoers.lan;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $portainer_upstream http://tso-portainer:9000;
        proxy_pass $portainer_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}

# ── 3. Zabbix (monitoreo) — server Debian físico 192.168.0.3 (services/zabbix) ──
# Zabbix corre en una máquina FÍSICA dedicada de la LAN (hostname zabbix,
# 192.168.0.3). El DNS actual apunta directamente a ella; este bloque queda
# disponible como proxy HTTPS opcional si se restaura el acceso vía dc1.
server {
    listen 80;
    server_name zabbix.sudoers.lan;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name zabbix.sudoers.lan;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $zabbix_upstream http://192.168.0.3:8080;
        proxy_pass $zabbix_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
    }
}

# ── 4. Webmail (Roundcube) ──
server {
    listen 80;
    server_name webmail.sudoers.lan;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name webmail.sudoers.lan;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $webmail_upstream http://tso-webmail:80;
        proxy_pass $webmail_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ── 4b. Gestor de archivos (Filebrowser) ──
server {
    listen 80;
    server_name archivos.sudoers.lan;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name archivos.sudoers.lan;

    # Sin límite de subida: los archivos van directo al share.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_http_version 1.1;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $files_upstream http://tso-files:80;
        proxy_pass $files_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
}

# ── 4c. Monitoreo (Grafana) y Apps ─────────────────────────────────
# grafana.sudoers.lan   -> tso-grafana:3000 (dashboards, services/monitoring)
#   Prometheus (:9090) y Alertmanager (:9093) NO se publican: solo escuchan
#   en 127.0.0.1 del host → SSH tunnel  -L 9090:127.0.0.1:9090
# zabbix: corre en el server físico 192.168.0.3 (ver sección 3).
# apps.sudoers.lan      -> apps internas (services/apps)
server {
    listen 80;
    server_name grafana.sudoers.lan;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name grafana.sudoers.lan;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $grafana_upstream http://tso-grafana:3000;
        proxy_pass $grafana_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Grafana usa WebSocket (live/datasource) y exporta PDF/largo.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# ── 4d. Firma Digital PAdES (UPDS) ──────────────────────────────────
# firma.sudoers.lan -> tso-firma:5000 (servidor de firma digital y validador)
server {
    listen 80;
    server_name firma.sudoers.lan;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name firma.sudoers.lan;

    # Permitir subir documentos PDF pesados para firmar/validar
    client_max_body_size 50M;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $firma_upstream http://tso-firma:5000;
        proxy_pass $firma_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ── 5. Sitio principal (portal de la intranet) ──────────────────────
server {
    listen 80;
    server_name sudoers.lan web.sudoers.lan www.sudoers.lan;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name sudoers.lan web.sudoers.lan www.sudoers.lan;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

# ── 5b. Subdominios de miembros ────────────────────────────────────
# joaquin.sudoers.lan  -> página estática del equipo (/equipo/joaquin.html)
# david.sudoers.lan    -> servicio web de la MÁQUINA de David (192.168.0.51:8080)
# nicolas.sudoers.lan  -> servicio web de la MÁQUINA de Nicolás (192.168.0.52:8080)
# Los tres resuelven al proxy (192.168.0.2). Guía: docs/publicar-servicios-admin.md.
server {
    listen 80;
    server_name joaquin.sudoers.lan;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name joaquin.sudoers.lan;

    root /usr/share/nginx/html;

    location = / { try_files /equipo/joaquin.html =404; }
    location / { try_files $uri $uri/ =404; }
}

server {
    listen 80;
    server_name david.sudoers.lan;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name david.sudoers.lan;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $david_upstream http://192.168.0.51:8080;
        proxy_pass $david_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name nicolas.sudoers.lan;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name nicolas.sudoers.lan;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $nicolas_upstream http://192.168.0.52:8080;
        proxy_pass $nicolas_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}

# ── 6. Servidor por defecto (IP directa http://192.168.100.85 o https://) ──
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/ssl/banco/server.crt;
    ssl_certificate_key /etc/ssl/banco/server.key;

    # Mitigación de DoS / Rate Limiting (Capa 7)
    limit_conn banco_conn 20;
    limit_req zone=banco_limit burst=30 nodelay;
    limit_req_status 429;

    # Bloqueo de escáneres web ofensivos (Nikto, sqlmap, gobuster, etc.)
    if ($escaner_malicioso) {
        return 403 "Acceso denegado: Herramienta de escaneo no autorizada por politica bancaria.\n";
    }

    # ── Firewall Web de Aplicación (WAF) ──────────────────────────
    # Bloqueo proactivo de Inyecciones SQL (SQLi)
    if ($bloqueo_sqli) {
        return 403 "Acceso denegado [WAF-ANTI-SQLI]: Carga util de Inyeccion SQL detectada y neutralizada por el Firewall Web de la organizacion.\n";
    }

    # Bloqueo proactivo de Path Traversal / LFI
    if ($bloqueo_traversal) {
        return 403 "Acceso denegado [WAF-ANTI-LFI]: Intento de Path/Directory Traversal detectado y neutralizado.\n";
    }

    # Cabeceras de seguridad bancaria (PCI-DSS / OWASP)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    # Endpoint interactivo para demostración de consultas vs SQLi
    location /consulta {
        default_type application/json;
        return 200 '{"status":"ok","mensaje":"Consulta bancaria exitosa","cuenta":"$arg_cuenta","saldo":"$12,450.00","titular":"Usuario Demo Banco Sudoers","politica_waf":"WAF Anti-SQLi Activo"}\n';
    }

    location / {
        try_files $uri $uri/ /index.html =404;
    }
}